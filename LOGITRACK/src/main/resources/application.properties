
spring.application.name=LogiTrack

# ===============================
# DATABASE
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/logitrack?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Samira12}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===============================
# FLYWAY
# ===============================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ===============================
# JWT
# ===============================
app.jwt.secret=${JWT_SECRET:MaCleSecreteSuperLongueEtSecurisee1234567890!}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

# ===============================
# REDIS
# ===============================
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

# ===============================
# NOTIFICATION SERVICE
# ===============================
notification.service.url=${NOTIFICATION_SERVICE_URL:http://localhost:8081}

# ===============================
# OPENFEIGN
# ===============================
spring.cloud.openfeign.client.config.notification-service.connect-timeout=5000
spring.cloud.openfeign.client.config.notification-service.read-timeout=5000

# ===============================
# ACTUATOR / PROMETHEUS
# ===============================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.tags.application=logitrack
management.prometheus.metrics.export.enabled=true